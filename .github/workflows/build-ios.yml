name: Build Blear IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Disable SwiftLint
        run: |
          python3 - <<'PY'
          import re
          p = "Blear.xcodeproj/project.pbxproj"
          lines = open(p, encoding="utf8").read().split("\n")
          n = 0
          for i, l in enumerate(lines):
              if "shellScript" in l and "swiftlint" in l.lower():
                  lines[i] = re.sub(r'shellScript = .*;\s*$', 'shellScript = "exit 0";', l)
                  n += 1
          open(p, "w", encoding="utf8").write("\n".join(lines))
          print("patched script phases:", n)
          PY
          for d in /opt/homebrew/bin /usr/local/bin; do
            sudo mkdir -p "$d"
            printf '#!/bin/sh\nexit 0\n' | sudo tee "$d/swiftlint" >/dev/null
            sudo chmod +x "$d/swiftlint"
          done
          grep -n -i "swiftlint" Blear.xcodeproj/project.pbxproj | cut -c1-160 || true

      - name: Detect scheme
        run: |
          SCHEME=$(xcodebuild -list -json -project Blear.xcodeproj | python3 -c "import sys,json; s=json.load(sys.stdin)['project']['schemes']; print('Blear' if 'Blear' in s else s[0])")
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV

      - name: Build (no code signing)
        run: |
          xcodebuild -project Blear.xcodeproj -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Blear.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Blear-ipa
          path: Blear.ipa
