name: Build Blear IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Disable SwiftLint phase
        run: |
          python3 - <<'PY'
          import re
          p = "Blear.xcodeproj/project.pbxproj"
          s = open(p, encoding="utf8").read()
          n, c = re.subn(r'(name = "?SwiftLint"?;.*?shellScript = )"(?:[^"\\]|\\.)*";', r'\1"exit 0";', s, flags=re.S)
          print("patched phases:", c)
          open(p, "w", encoding="utf8").write(n)
          PY

      - name: Detect scheme
        run: |
          SCHEME=$(xcodebuild -list -json -project Blear.xcodeproj | python3 -c "import sys,json; s=json.load(sys.stdin)['project']['schemes']; print('Blear' if 'Blear' in s else s[0])")
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV

      - name: Build (no code signing)
        run: |
          xcodebuild -project Blear.xcodeproj -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Blear.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Blear-ipa
          path: Blear.ipa
